<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>viqueue board</title><link rel="stylesheet" href="/app.css"><script type="module" src="/app.js"></script></head><body>
<header class="masthead"><div><h1>viqueue</h1><p>agents pull work · questions do not stop workers</p></div><button id="refresh">Refresh board</button></header><main>
<section class="identity"><label>Current actor (workflow identity, not authentication)<select id="actor-select"><option value="">Choose actor</option></select></label><span id="all-question-badge" class="badge">0 open total</span><span id="my-question-badge" class="badge">0 for you</span></section>
<section id="inbox-panel"><h2>Questions for you</h2><div id="inbox-list"><p>Choose a registered actor.</p></div></section>
<section class="controls"><form id="project-form"><label>New project<input name="key" required pattern="[A-Za-z][A-Za-z0-9]{1,9}"></label><button>Create project</button></form><label>Project<select id="project-select"></select></label><form id="ticket-form"><label>New ticket<input name="title" required></label><button>Create ticket</button></form></section>
<p id="status" role="status" aria-live="polite">Loading board…</p><nav id="state-tabs" class="state-tabs" role="tablist" aria-label="Ticket state"><button role="tab" data-tab="ready" aria-selected="true">Ready <span>0</span></button><button role="tab" data-tab="working">Working <span>0</span></button><button role="tab" data-tab="review">Review <span>0</span></button><button role="tab" data-tab="done">Done <span>0</span></button></nav><section id="board" class="board"></section></main>
<dialog id="detail"><form method="dialog" class="dialog-head"><h2>Ticket detail</h2><button aria-label="Close">×</button></form>
<form id="edit-form"><input name="id" type="hidden"><label>Title<input name="title" required></label><label>Body<textarea name="body"></textarea></label><label>Assignment<select name="assignee"><option value="">Unassigned</option></select></label><button>Save ticket</button></form>
<section><h3>Questions and answers</h3><ol id="questions"></ol><form id="ask-form"><input name="ticket_id" type="hidden"><label>Ask question<input name="text" required></label><label>Target<select name="target" required></select></label><label>Claim ID<input name="claim_id" required></label><label>Claim token<input name="claim_token" type="password" required></label><label>Generation<input name="generation" type="number" min="1" required></label><button>Ask without stopping</button></form></section>
<section><h3>Chronological events</h3><ol id="history"></ol></section>
<form id="action-form"><input name="id" type="hidden"><label>Claim actor<input name="actor" required></label><label>Claim ID<input name="claim_id"></label><label>Claim token<input name="claim_token" type="password"></label><label>Generation<input name="generation" type="number" min="1"></label><label>Message<input name="message"></label><label>Review target<select name="reviewer"></select></label><label>Local operator token<input name="authorization" type="password"></label><div id="actions" class="dialog-actions"></div></form></dialog>
</body></html>
