<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>viqueue</title><link rel="stylesheet" href="/app.css"><script type="module" src="/app.js"></script></head>
<body><header class="masthead"><div><h1>viqueue</h1><p>A shared queue for people and their workers</p></div><button id="refresh" type="button">Refresh</button></header>
<main><section class="identity"><label for="actor-select">Your name</label><select id="actor-select"><option value="">Choose your name</option></select><p>Choose once so we can show what needs your attention.</p></section>
<section id="inbox-panel" aria-labelledby="inbox-title"><div class="section-head"><div><p class="eyebrow">Your inbox</p><h2 id="inbox-title">Questions for you</h2></div><strong id="inbox-count"></strong></div><div id="inbox-list"><p>Choose your name to see questions waiting for you.</p></div></section>
<section class="overview"><div><p class="eyebrow">Overview</p><h2>All tickets</h2></div></section>
<section class="filters" aria-label="Board filters"><div><strong>Projects</strong><div id="project-chips" class="chip-row" role="group" aria-label="Projects"></div></div><div><strong>Assignees</strong><div id="assignee-chips" class="chip-row" role="group" aria-label="Assignees"></div></div></section>
<div id="filter-empty" class="filter-empty" hidden>No tickets match these filters. <button id="reset-filters" type="button" class="secondary">Show All</button></div>
<div class="create-actions"><button id="open-project-create" type="button" class="secondary">Create project</button><button id="open-ticket-create" type="button">Create ticket</button></div>
<p id="status" role="status" aria-live="polite">Loading tickets…</p>
<nav id="state-tabs" class="state-tabs" role="tablist" aria-label="Ticket state"><button role="tab" data-tab="ready" aria-selected="true">Ready <span>0</span></button><button role="tab" data-tab="working" aria-selected="false">Working <span>0</span></button><button role="tab" data-tab="review" aria-selected="false">Review <span>0</span></button><button role="tab" data-tab="done" aria-selected="false">Done <span>0</span></button></nav><section id="board" class="board"></section></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><div><p id="modal-eyebrow" class="eyebrow"></p><h2 id="modal-title">viqueue</h2></div><button id="close-modal" type="button" class="secondary">Close</button></div><div id="modal-content"></div></dialog>
</body></html>
