<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>viqueue</title><link rel="stylesheet" href="/app.css"><script type="module" src="/app.js"></script></head>
<body><header class="masthead"><div><h1>viqueue</h1><p>One board for Human and Agent work</p></div><div class="header-actions"><button id="disconnect-device" class="secondary utility-action" type="button" aria-label="Disconnect this device" hidden>Disconnect<span class="wide-action-label"> this device</span></button><button id="refresh" class="secondary utility-action" type="button" hidden>Refresh</button><button id="open-machines" type="button" class="secondary">Machines</button><button id="open-project-create" type="button" class="secondary">+ Project</button><button id="open-ticket-create" type="button">+ Ticket</button></div></header>
<section id="pairing" class="pairing" aria-labelledby="pairing-title" hidden><p class="eyebrow">Device pairing</p><h2 id="pairing-title">Pair this browser</h2><p>Ask a coordinator for a one-time pairing code.</p><form id="pairing-form"><label>One-time code<input name="code" required autocomplete="one-time-code"></label><button>Pair browser</button></form><p id="pairing-status" role="status" aria-live="polite"></p></section>
<main id="app-shell" hidden><section class="filters" aria-label="Board filters"><div><strong>Project</strong><div id="project-chips" class="chip-row" role="group" aria-label="Projects"></div></div><div><strong>Assignment</strong><div id="role-chips" class="chip-row" role="group" aria-label="Worker type filters"><!-- Human and Agent only --></div></div></section>
<span id="inbox-count" hidden></span><select id="actor-select" hidden><option value="">Actor</option></select><div id="inbox-list" hidden></div><div id="filter-empty" class="filter-empty" hidden>No tickets match. <button id="reset-filters" type="button" class="secondary">Show all</button></div><p id="status" role="status" aria-live="polite">Loading…</p>
<span class="sr-only">Questions are answered inline in Activity and ticket popups.</span><nav id="state-tabs" class="state-tabs" role="tablist" aria-label="Board surfaces"><button role="tab" data-tab="Open" aria-selected="false">Open <span>0</span></button><button role="tab" data-tab="Working" aria-selected="false">Working <span>0</span></button><button role="tab" data-tab="Waiting" aria-selected="false">Waiting <span>0</span></button><button role="tab" data-tab="Done" aria-selected="false">Done <span>0</span></button><button role="tab" data-tab="Activity" aria-selected="true">Activity <span>0</span></button></nav><section id="board" class="board"></section></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><div><p id="modal-eyebrow" class="eyebrow"></p><h2 id="modal-title">viqueue</h2></div><button id="close-modal" type="button" class="secondary">Close</button></div><div id="modal-content"></div></dialog>
</body></html>
