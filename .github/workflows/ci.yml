name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Scan tracked source and history checkout
        run: npm run scan:secrets
      - name: Full local end-to-end suite
        run: npm run e2e
      - name: Build deterministic release candidate twice
        shell: bash
        run: |
          release_name="$(node -p "'viqueue-v' + require('./package.json').version + '-rc'")"
          archive="release/${release_name}.tar.gz"
          npm run bundle
          first="$(sha256sum "$archive" | cut -d' ' -f1)"
          sleep 2
          npm run bundle
          second="$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$first" = "$second"
          (cd release && sha256sum -c "${release_name}.tar.gz.sha256")
          while IFS= read -r target; do
            tar -tzf "$archive" "${release_name}/${target}" >/dev/null
          done < <(node -e "for (const target of Object.values(require('./package.json').bin)) console.log(target)")
          for target in src/server.js src/phone-gateway.js; do
            tar -tzf "$archive" "${release_name}/${target}" >/dev/null
          done
