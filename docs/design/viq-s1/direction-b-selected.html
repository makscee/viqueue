<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIQ-S1 — Decision desk + work rail</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#17212b;background:#eef1f3;font-size:14px;--line:#cbd2d8;--paper:#fff;--soft:#f5f7f8;--ink:#17212b;--accent:#244d66}
*{box-sizing:border-box}body{margin:0;min-width:0}button,select,input,textarea{font:inherit;color:inherit}button,select{min-height:32px}button{border:1px solid #aeb8c0;background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.primary{background:#244d66;color:white;border-color:#244d66}.shell{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:12px}.mast{display:flex;align-items:center;gap:16px;min-width:0}.brand{font-weight:750;font-size:18px;letter-spacing:-.02em}.tagline{color:#66717a;font-size:12px}.actions{margin-left:auto;display:flex;gap:7px}.filters{display:flex;align-items:center;gap:8px;min-width:0}.filter-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#65717b}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip[aria-pressed=true]{background:#dbe6ec;border-color:#8197a5}.role-start{margin-left:8px}.canvas{min-height:0;display:grid;gap:8px}.lane,.activity{background:#f7f8f9;border:1px solid var(--line);border-radius:8px;min-width:0;min-height:0;overflow:auto}.lane h2,.activity h2{font-size:13px;margin:0;padding:10px 10px 8px;border-bottom:1px solid #dfe4e7;position:sticky;top:0;background:#f7f8f9;z-index:1}.count{float:right;color:#7a858e;font-weight:500}.stack{padding:7px;display:grid;gap:6px}.card{background:var(--paper);border:1px solid #d5dbe0;border-radius:6px;padding:8px;text-align:left;min-width:0;box-shadow:0 1px 1px #17212b0a}.card:hover{border-color:#7f96a5}.card-id{font-size:10px;color:#65727c;letter-spacing:.04em}.card-title{font-weight:650;font-size:12px;line-height:1.3;margin:3px 0 7px;overflow-wrap:anywhere}.meta{display:flex;gap:5px;flex-wrap:wrap;color:#53616c;font-size:10px}.badge{background:#edf1f3;border-radius:10px;padding:2px 6px}.question-badge{background:#f2e6c9;color:#694b0c}.machine{color:#315f79}.question{background:#fff8e9;border:1px solid #d9c18b;border-radius:6px;padding:8px}.question strong,.feed strong{display:block;font-size:11px}.question-title{font-weight:650;font-size:11px;line-height:1.3;margin-top:3px;overflow-wrap:anywhere}.question p{font-size:11px;line-height:1.35;margin:4px 0 7px}.question .answer{display:flex;gap:5px;flex-wrap:wrap}.question button{min-height:28px;font-size:11px;padding:3px 7px}.feed{border-top:1px solid #e0e4e7;padding:8px;font-size:10px;line-height:1.35;background:white}.feed:first-of-type{border-top:0}.feed span{color:#64717a}.annotation{position:fixed;right:12px;bottom:10px;z-index:6;width:278px;background:#17212bef;color:white;padding:9px 11px;border-radius:7px;font-size:10px;line-height:1.35;box-shadow:0 4px 18px #0003}.annotation strong{font-size:11px}.annotation span{display:block;color:#d4dde2}.tabs{display:none}.state-message{grid-column:1/-1;display:grid;place-items:center;background:white;border:1px solid var(--line);border-radius:8px;text-align:center;padding:30px}.skeleton{height:56px;border-radius:6px;background:linear-gradient(90deg,#e7ebee,#f5f7f8,#e7ebee)}
dialog{border:0;border-radius:9px;padding:0;max-width:min(620px,calc(100vw - 24px));width:100%;box-shadow:0 20px 60px #10182055}dialog::backdrop{background:#18232d66}.modal{padding:16px}.modal-head{display:flex;gap:10px;align-items:start;border-bottom:1px solid #dfe4e7;padding-bottom:10px;margin-bottom:12px}.modal-head h2{font-size:17px;margin:2px 0}.modal-head small{color:#63717b}.close{margin-left:auto}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.fact{background:#f2f5f6;padding:7px;border-radius:5px}.fact small{display:block;color:#65717b}.modal h3{font-size:13px;margin:15px 0 6px}.event-list{padding-left:20px;font-size:12px;line-height:1.55}.composer{display:flex;gap:6px}.composer input{min-height:34px;flex:1;min-width:0;border:1px solid #aeb8c0;border-radius:5px;padding:6px}.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-size:12px;font-weight:600}.form input,.form select,.form textarea{border:1px solid #aeb8c0;border-radius:5px;padding:7px;min-width:0}.machine-row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid #e0e4e7}.machine-row span{font-size:12px}.error{color:#7a2626}
/* Direction A: balanced parallel lanes */
.dir-a .canvas{grid-template-columns:repeat(5,minmax(0,1fr))}
/* Direction B: activity desk anchors the left, work scans right */
.dir-b .canvas{grid-template-columns:minmax(300px,1.55fr) repeat(4,minmax(0,1fr))}.dir-b .activity{grid-column:1;grid-row:1}.dir-b .lane{grid-row:1}.dir-b .activity h2{font-size:16px;padding:12px}.dir-b .question{padding:11px}.dir-b .question p{font-size:12px}
/* Direction C: work sequence resolves into a right-side decision anchor */
.dir-c .canvas{grid-template-columns:minmax(0,1.05fr) minmax(0,.82fr) minmax(0,.82fr) minmax(0,.9fr) minmax(300px,1.55fr)}.dir-c .lane{border-radius:3px}.dir-c .lane:nth-child(1){border-left:4px solid #8498a5}.dir-c .activity{border-radius:12px;border-color:#8ca0ad;box-shadow:inset 3px 0 0 #244d66}.dir-c .activity h2{font-size:16px;padding:12px}.dir-c .question{margin:8px}.dir-c .feed-wrap{border-top:1px solid #dfe4e7}.dir-c .feed{padding:10px}
@media(max-width:600px){.shell{height:100dvh;padding:10px;grid-template-rows:auto auto auto minmax(0,1fr);gap:8px}.tagline{display:none}.mast{align-items:center}.actions{gap:5px}.actions button{padding-inline:8px}.filters{align-items:flex-start;display:grid;grid-template-columns:auto 1fr;gap:5px 7px}.role-start{margin-left:0}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.tabs button{padding:4px 1px;font-size:10px;white-space:nowrap}.canvas,.dir-a .canvas,.dir-b .canvas,.dir-c .canvas{display:block;min-height:0}.lane,.activity,.dir-b .activity,.dir-b .lane,.dir-c .activity,.dir-c .lane{height:100%;display:none}.lane.active,.activity.active{display:block}.annotation{display:none}.facts{grid-template-columns:1fr 1fr}dialog{height:100dvh;max-width:none;width:100%;border-radius:0}.modal{min-height:100%;padding:13px}.card-title{font-size:13px}.stack{padding:8px}.question p{font-size:12px}.feed{font-size:11px;padding:10px}}
@media(max-width:340px){.shell{padding:8px}.brand{font-size:16px}.actions button{font-size:11px;padding-inline:6px}.chips{gap:3px}.chip{font-size:11px;padding-inline:7px}.tabs button{font-size:9px}.facts{grid-template-columns:1fr}.modal-head h2{font-size:15px}}
</style></head><body class="dir-b"><div class="shell">
<header class="mast"><div><div class="brand">viqueue</div><div class="tagline">One board for Human and Agent work</div></div><div class="actions"><button data-popup="machines">Machines</button><button class="primary" data-popup="create">+ Ticket</button></div></header>
<section class="filters" aria-label="Board filters"><span class="filter-label">Project</span><div class="chips"><button class="chip project" aria-pressed="true">VIQ</button><button class="chip project" aria-pressed="true">OPS</button></div><span class="filter-label role-start">Assignment</span><div class="chips"><button class="chip role" aria-pressed="false">Human</button><button class="chip role" aria-pressed="false">Agent</button></div></section>
<nav class="tabs" role="tablist" aria-label="Board views"><button role="tab" data-tab="open">Open</button><button role="tab" data-tab="working">Working</button><button role="tab" data-tab="waiting">Waiting</button><button role="tab" data-tab="done">Done</button><button role="tab" data-tab="activity" aria-selected="true">Activity</button></nav>
<main class="canvas" id="canvas"></main></div>
<dialog id="dialog"><div class="modal" id="modal"></div></dialog>
<div class="annotation"><strong>THESIS</strong><span id="thesis"></span><strong>PHONE</strong><span>Five tabs replace simultaneous columns; Activity opens by default.</span><strong>STRENGTH</strong><span id="strength"></span><strong>TRADEOFF</strong><span id="tradeoff"></span></div><script>const fixture = {
  projects: ["VIQ", "OPS"],
  tickets: [
    {id:"VIQ-12", title:"Define the smallest useful human-agent handoff", assignment:"Agent", state:"open", question:"", machine:""},
    {id:"OPS-7", title:"Replace expiring production pairing certificate before the overnight maintenance window closes", assignment:"Human", state:"open", question:"1 open question", machine:""},
    {id:"VIQ-11", title:"Implement atomic claim ordering", assignment:"Agent", state:"working", question:"", machine:"studio-mini"},
    {id:"OPS-6", title:"Confirm recovery runbook", assignment:"Human", state:"waiting", question:"Blocking approval", machine:""},
    {id:"VIQ-10", title:"Capture baseline browser flow", assignment:"Unassigned", state:"done", question:"", machine:""}
  ],
  questions: [
    {id:"OPS-6", label:"Blocking approval", title:"Confirm recovery runbook", body:"Approve the rollback sequence before the maintenance window?", actions:["Accept", "Request changes"]},
    {id:"OPS-7", label:"Question", title:"Replace expiring production pairing certificate before the overnight maintenance window closes", body:"Which maintenance window should we use?", actions:["Answer"]}
  ],
  events: [
    "studio-mini claimed VIQ-11 · Agent machine · 09:42",
    "Maks assigned OPS-7 to Human · 09:35",
    "OPS-6 submitted for approval · field-agent-2 · 09:18",
    "VIQ-10 moved to Done · Maks · Yesterday"
  ]
};
document.querySelector('#thesis').textContent='A wider Activity desk anchors decisions; four compact work lanes remain co-visible to its right.';document.querySelector('#strength').textContent='Questions and provenance lead without hiding board consequence.';document.querySelector('#tradeoff').textContent='Ticket titles wrap sooner in the narrower work rail.';
const params=new URLSearchParams(location.search);const requested=params.get('state')||'normal';let active=matchMedia('(max-width:600px)').matches?'activity':'all';
const labels={open:'Open',working:'Working',waiting:'Waiting',done:'Done'};
function card(t){return `<button class="card" data-ticket="${t.id}"><span class="card-id">${t.id}</span><div class="card-title">${t.title}</div><span class="meta"><span class="badge">${t.assignment}</span>${t.question?`<span class="badge question-badge">${t.question}</span>`:''}${t.machine?`<span class="badge machine">● ${t.machine}</span>`:''}</span></button>`}
function activity(){const qs=requested==='filtered'?fixture.questions.filter(q=>q.id.startsWith('VIQ-')):fixture.questions;const es=requested==='filtered'?fixture.events.filter(e=>e.includes('VIQ-')):fixture.events;return `<section class="activity ${active==='activity'?'active':''}" data-view="activity"><h2>Activity <span class="count">${qs.length} questions</span></h2>${qs.map(q=>`<article class="question"><strong>${q.label} · ${q.id}</strong><div class="question-title">${q.title}</div><p>${q.body}</p><div class="answer">${q.actions.map(a=>`<button>${a}</button>`).join('')}</div></article>`).join('')}<div class="feed-wrap">${es.map(e=>`<div class="feed"><strong>${e.split(' · ')[0]}</strong><span>${e.split(' · ').slice(1).join(' · ')}</span></div>`).join('')}</div></section>`}
function render(){const c=document.querySelector('#canvas');if(requested==='loading'){c.innerHTML=`<div class="state-message"><div><div class="skeleton" style="width:220px"></div><p>Loading board…</p></div></div>`;return}if(requested==='error'){c.innerHTML=`<div class="state-message error"><div><strong>Board could not load</strong><p>Check the connection and try again.</p><button>Retry</button></div></div>`;return}if(requested==='empty'){c.innerHTML=`<div class="state-message"><div><strong>No tickets yet</strong><p>Capture the first ticket for this project.</p><button class="primary" data-popup="create">+ Ticket</button></div></div>`;wire();return}const filtered=requested==='filtered';const tickets=filtered?fixture.tickets.filter(t=>t.id.startsWith('VIQ-')):fixture.tickets;c.innerHTML=['open','working','waiting','done'].map(s=>`<section class="lane ${active===s?'active':''}" data-view="${s}"><h2>${labels[s]} <span class="count">${tickets.filter(t=>t.state===s).length}</span></h2><div class="stack">${tickets.filter(t=>t.state===s).map(card).join('')||'<p class="empty">Nothing here</p>'}</div></section>`).join('')+activity();wire()}
function popup(kind,id){const d=document.querySelector('#dialog'),m=document.querySelector('#modal');if(kind==='create')m.innerHTML=`<div class="modal-head"><div><small>New ticket</small><h2>Capture work</h2></div><button class="close">Close</button></div><form class="form"><label>Project<select name="project" required><option value="">Choose a project</option><option>VIQ</option><option>OPS</option></select></label><label>Title<input name="title" required placeholder="What needs doing?"></label><label>Description (optional)<textarea rows="4"></textarea></label><label>Assignment (optional)<select><option>Unassigned</option><option>Human</option><option>Agent</option></select></label><button class="primary" data-create disabled>Create ticket</button></form>`;else if(kind==='machines')m.innerHTML=`<div class="modal-head"><div><small>Execution provenance</small><h2>Machines</h2></div><button class="close">Close</button></div><div class="machine-row"><span><strong>studio-mini</strong><br>Agent · Active</span><button>Revoke</button></div><div class="machine-row"><span><strong>field-agent-2</strong><br>Agent · Active</span><button>Revoke</button></div><h3>Pair machine</h3><form class="form"><label>Role<select><option>Agent</option><option>Human</option></select></label><label>Name<input value=""></label><label>Pairing code<input value=""></label><button class="primary">Add machine</button></form>`;else{const t=fixture.tickets.find(x=>x.id===(id||'VIQ-11'));m.innerHTML=`<div class="modal-head"><div><small>${t.id} · ${t.state}</small><h2>${t.title}</h2></div><button class="close">Close</button></div><div class="facts"><div class="fact"><small>Project</small>${t.id.split('-')[0]}</div><div class="fact"><small>Assignment</small>${t.assignment}</div><div class="fact"><small>Machine</small>${t.machine||'—'}</div></div><h3>Description</h3><p>Keep the operator's next decision and its factual context together.</p><h3>Questions</h3><div class="question"><strong>Question · ${t.id}</strong><p>Should this remain in the current global order?</p><button>Answer</button></div><h3>History</h3><ol class="event-list"><li>Ticket created · Maks</li><li>Assignment changed · Maks</li><li>Work claimed · ${t.machine||'studio-mini'}</li></ol><h3>Add event</h3><form class="composer"><input aria-label="Event" placeholder="Add factual context"><button class="primary">Add</button></form>`}if(kind==='create'){const form=m.querySelector('form'),create=m.querySelector('[data-create]');const sync=()=>{create.disabled=!(form.elements.project.value&&form.elements.title.value.trim())};form.addEventListener('input',sync);form.addEventListener('change',sync);sync()}d.showModal();m.querySelector('.close').onclick=()=>d.close()}
function wire(){document.querySelectorAll('[data-ticket]').forEach(x=>x.onclick=()=>popup('ticket',x.dataset.ticket));document.querySelectorAll('[data-popup]').forEach(x=>x.onclick=()=>popup(x.dataset.popup));}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render()});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');});
const forced=params.get('popup');render();if(forced)popup(forced,params.get('ticket'));
</script></body></html>
